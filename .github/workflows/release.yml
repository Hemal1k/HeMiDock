# A release published on GitHub gets its downloads here: they are built from the source of its tag and attached to it.
# Run by hand (Actions → Release → Run workflow) it only builds them, as an artifact to try out.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# nothing by default; the job that attaches the downloads gets write access to the releases only
permissions: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # a fixed version: the compiler makes the published installer (6.7.3 is the one release.ps1 is tried with)
      # Inno Setup 6.7.1 without Chocolatey: the one the runner has, else the installer of its author (GitHub release of
      # jrsoftware/issrc) – run only when its SHA256 matches
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # ISCC.exe carries no version: its uninstall entry tells it
          $have = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DisplayVersion -First 1
          if ((Test-Path $iscc) -and $have -eq '6.7.1') { Write-Host 'Inno Setup 6.7.1 is there'; exit 0 }
          $f = "$env:RUNNER_TEMP\innosetup-6.7.1.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe -OutFile $f
          if ((Get-FileHash $f -Algorithm SHA256).Hash -ne '4D11E8050B6185E0D49BD9E8CC661A7A59F44959A621D31D11033124C4E8A7B0') { throw 'Inno Setup: the download does not match its SHA256' }
          Start-Process $f -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait
          if (-not (Test-Path $iscc)) { throw 'Inno Setup was not installed' }

      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./release.ps1


      - name: Checksums
        shell: pwsh
        run: Get-ChildItem build/dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeMiDock
          path: build/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:TAG" build/dist/HeMiDock-Setup.exe build/dist/HeMiDock-Portable.zip build/dist/HeMiDock-Portable-arm64.zip build/dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
