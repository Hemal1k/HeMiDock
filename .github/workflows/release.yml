# A release published on GitHub gets its downloads here: they are built from the source of its tag and attached to it.
# Run by hand (Actions → Release → Run workflow) it only builds them, as an artifact to try out.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./release.ps1


      - name: Checksums
        shell: pwsh
        run: Get-ChildItem build/dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HeMiDock
          path: build/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/dist/HeMiDock-Setup.exe build/dist/HeMiDock-Portable.zip build/dist/HeMiDock-Portable-arm64.zip build/dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"

  winget:
    # the new version to winget as a pull request to microsoft/winget-pkgs (once the app is there and the secret
    # WINGET_TOKEN – a token of the owner with public_repo – is set; without it the job does nothing)
    needs: build
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - name: Pull request to winget-pkgs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host 'No WINGET_TOKEN - skipped.'; exit 0 }
          gh api repos/Hemal1k/.github/contents/winget/update.ps1 -H 'Accept: application/vnd.github.raw' > update.ps1
          ./update.ps1 -App HeMiDock -Version '${{ github.event.release.tag_name }}'
